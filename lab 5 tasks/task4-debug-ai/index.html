<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 05 - Task 4</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Course Explorer</h1>
        <p>Lab 05 - Task 4: Debug It and Question AI</p>
    </header>

    <main>
        <section class="controls">
            <input type="text" id="searchInput" placeholder="Search courses...">
            <button id="freeButton">Show Free Courses: OFF</button>
        </section>

        <p id="resultCount"></p>
        <section id="courseList" class="course-list"></section>

        <section class="comment-section">
            <h2>Student Comment</h2>
            <input type="text" id="commentInput" placeholder="Write your comment">
            <button id="commentButton">Add Comment</button>
            <p id="commentOutput"></p>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
