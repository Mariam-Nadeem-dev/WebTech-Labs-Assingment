<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Explorer</title>
    <link rel="stylesheet" href="task2-styles.css">
</head>
<body>

    <header>
        <h1>Course Explorer</h1>
        <p>Explore our learning programs</p>
    </header>

    <section class="filters">

        <input
            type="text"
            id="searchInput"
            placeholder="Search courses..."
        >

        <select id="categoryFilter">
            <option value="All">All Categories</option>
            <option value="Web Development">Web Development</option>
            <option value="Programming">Programming</option>
            <option value="Database">Database</option>
            <option value="Security">Security</option>
            <option value="Design">Design</option>
            <option value="Technology">Technology</option>
        </select>

        <button id="sortButton">Sort by Price</button>

    </section>

    <p id="resultCount"></p>

    <main id="courseContainer" class="course-container"></main>

    <script src="task2-app.js"></script>

</body>
</html>
